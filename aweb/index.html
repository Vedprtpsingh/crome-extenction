<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure File Transfer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-cloud-upload-alt"></i>
            </div>
            <h1>Secure File Transfer</h1>
            <p>Upload your files securely - No login required</p>
        </header>

        <main>
            <form id="fileTransferForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="name">
                        <i class="fas fa-user"></i> Name
                    </label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>

                <div class="form-group">
                    <label for="file">
                        <i class="fas fa-file-upload"></i> File Upload
                    </label>
                    <div class="file-upload-wrapper" id="dropZone">
                        <input type="file" id="file" name="file" required>
                        <div class="upload-content">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Click to select or drag & drop your file</p>
                            <span id="fileName">No file selected</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">
                        <i class="fas fa-comment"></i> Message / Description
                    </label>
                    <textarea id="message" name="message" rows="4" placeholder="Enter any additional details about your file..."></textarea>
                </div>

                <button type="submit" id="submitBtn">
                    <span class="btn-text">
                        <i class="fas fa-paper-plane"></i> Submit
                    </span>
                    <span class="btn-loading">
                        <i class="fas fa-spinner fa-spin"></i> Uploading...
                    </span>
                </button>

                <div id="statusMessage" class="status-message"></div>
            </form>

            <div class="features">
                <div class="feature">
                    <i class="fas fa-shield-alt"></i>
                    <span>Secure Transfer</span>
                </div>
                <div class="feature">
                    <i class="fas fa-bell"></i>
                    <span>Email Notification</span>
                </div>
                <div class="feature">
                    <a href="https://www.linkedin.com/in/vedprtpsingh" target="_blank" style="text-decoration: none; color: inherit;">
                        <i class="fab fa-linkedin"></i>
                        <span>LinkedIn</span>
                    </a>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 Secure File Transfer. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
