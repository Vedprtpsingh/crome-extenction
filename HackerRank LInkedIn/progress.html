<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px;
      resize: both;
    }

    .card {
      background: white;
      border-radius: clamp(8px, 2vmin, 16px);
      padding: clamp(15px, 5vmin, 30px);
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(5px, 2vmin, 12px);
    }

    .progress-number {
      font-size: clamp(16px, 10vmin, 48px);
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .username {
      font-size: clamp(10px, 4vmin, 18px);
      color: #7f8c8d;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .spinner {
      width: clamp(16px, 6vmin, 30px);
      height: clamp(16px, 6vmin, 30px);
      border: 2px solid rgba(102, 126, 234, 0.2);
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 1vmin auto 0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="progress-number" id="progress-number">0 / 0</div>
    <div class="username" id="progress-username">Initializing...</div>
    <div class="spinner"></div>
  </div>
  
  <script src="progress.js"></script>
</body>
</html>
